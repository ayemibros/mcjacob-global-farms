<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - MC-JACOB GLOBAL FARMS LTD</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand">
      <div class="brand-logo">🌿</div>
      <div class="brand-text"><h1>MC-JACOB</h1><span>GLOBAL FARMS LTD</span></div>
    </a>
    <ul class="navbar-nav" id="main-nav">
      <li><a href="/">Home</a></li>
      <li><a href="/shop.html" class="active">Shop</a></li>
      <li id="nav-dashboard" style="display:none"><a href="/dashboard.html">My Account</a></li>
    </ul>
    <div class="navbar-actions">
      <a href="/cart.html" class="btn-cart">🛒 Cart <span class="cart-badge" style="display:none">0</span></a>
      <a href="/login.html" class="btn btn-login btn-sm" id="nav-login">Sign In</a>
      <div id="nav-user-menu" style="display:none;align-items:center;gap:8px">
        <span style="color:rgba(255,255,255,0.8);font-size:14px">Hi, <strong class="user-name"></strong></span>
        <button onclick="logout()" class="btn btn-sm" style="background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.2)">Logout</button>
      </div>
      <button class="nav-toggle">☰</button>
    </div>
  </div>
</nav>

<div style="background:var(--primary-dark);padding:28px 0">
  <div class="container">
    <div class="breadcrumb" style="color:rgba(255,255,255,0.6)">
      <a href="/" style="color:var(--gold)">Home</a> <span>/</span> Shop
    </div>
    <h1 style="color:white;font-size:32px">Our Product Catalogue</h1>
    <p style="color:rgba(255,255,255,0.7);margin-top:6px">All products sold in bundles — minimum order quantities apply</p>
  </div>
</div>

<section style="background:var(--light-gray);padding:40px 0;min-height:70vh">
  <div class="container">
    <div class="filter-bar">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search products..." onkeyup="debouncedSearch()">
      </div>
      <select class="filter-select" id="category-filter" onchange="loadProducts()">
        <option value="">All Categories</option>
      </select>
      <select class="filter-select" id="sort-filter" onchange="loadProducts()">
        <option value="">Sort by</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
        <option value="name">Name A-Z</option>
      </select>
    </div>

    <div id="products-container" class="products-grid">
      <div class="loading-spinner" style="grid-column:1/-1"><div class="spinner"></div></div>
    </div>

    <div id="no-products" class="empty-state" style="display:none">
      <div class="empty-icon">📦</div>
      <h3>No products found</h3>
      <p>Try adjusting your search or filter criteria.</p>
    </div>
  </div>
</section>

<!-- Add to Cart Modal -->
<div class="modal-overlay" id="add-cart-modal">
  <div class="modal" style="max-width:440px">
    <div class="modal-header">
      <h3>Add to Cart</h3>
      <button class="modal-close" onclick="closeModal('add-cart-modal')">×</button>
    </div>
    <div class="modal-body" id="add-cart-modal-body">
    </div>
  </div>
</div>

<a href="#" id="wa-float" class="whatsapp-float" title="Chat on WhatsApp">💬</a>
<div id="toast-container"></div>

<script src="/js/app.js"></script>
<script src="/js/cart.js"></script>
<script>
let allProducts = [];
let selectedProduct = null;

const debouncedSearch = debounce(loadProducts, 400);

async function loadProducts() {
  const search = document.getElementById('search-input').value;
  const category = document.getElementById('category-filter').value;
  const sort = document.getElementById('sort-filter').value;

  let url = '/products?';
  if (search) url += `search=${encodeURIComponent(search)}&`;
  if (category) url += `category=${encodeURIComponent(category)}&`;

  const container = document.getElementById('products-container');
  container.innerHTML = '<div class="loading-spinner" style="grid-column:1/-1"><div class="spinner"></div></div>';

  try {
    const data = await API.get(url);
    if (!data.success) throw new Error();

    let products = data.products;
    if (sort === 'price_asc') products.sort((a, b) => a.price - b.price);
    else if (sort === 'price_desc') products.sort((a, b) => b.price - a.price);
    else if (sort === 'name') products.sort((a, b) => a.name.localeCompare(b.name));

    allProducts = products;
    renderProducts(products);
  } catch (e) {
    container.innerHTML = '<p style="text-align:center;color:var(--gray);grid-column:1/-1;padding:40px">Failed to load products.</p>';
  }
}

function renderProducts(products) {
  const container = document.getElementById('products-container');
  const noProducts = document.getElementById('no-products');

  if (products.length === 0) {
    container.innerHTML = '';
    noProducts.style.display = 'block';
    return;
  }
  noProducts.style.display = 'none';

  container.innerHTML = products.map(p => `
    <div class="product-card">
      <div class="product-image">
        ${p.image ? `<img src="${p.image}" alt="${p.name}">` : '<span class="no-img">🌿</span>'}
        ${p.is_featured ? '<span class="product-badge">Featured</span>' : ''}
        ${p.stock_quantity === 0 ? '<span class="product-badge" style="background:var(--danger);color:white;right:12px;left:auto">Out of Stock</span>' : ''}
      </div>
      <div class="product-body">
        <div class="product-category">${p.category || 'Agricultural Product'}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-description">${p.description || ''}</div>
        <div class="product-meta">
          <span>📦 ${p.bundle_size} units/${p.bundle_unit}</span>
          ${p.net_weight ? `<span>⚖️ ${p.net_weight}</span>` : ''}
        </div>
        <div class="product-price">
          <span class="price-amount">${formatCurrency(p.price)}</span>
          <span class="price-per">per ${p.bundle_unit}</span>
        </div>
        <div style="font-size:12px;color:var(--gray);margin-bottom:12px">
          Min. order: ${p.min_order || 1} ${p.bundle_unit}(s)
          ${p.sku ? ` · SKU: ${p.sku}` : ''}
        </div>
        <div class="product-footer">
          <span class="stock-info ${p.stock_quantity < 5 ? 'low' : ''}">
            ${p.stock_quantity > 0 ? `${p.stock_quantity} available` : 'Out of stock'}
          </span>
          <button class="btn btn-green btn-sm" onclick="openAddToCart(${p.id})"
            ${p.stock_quantity === 0 ? 'disabled' : ''}>
            + Add to Cart
          </button>
        </div>
      </div>
    </div>
  `).join('');
}

function openAddToCart(productId) {
  if (!isLoggedIn()) {
    Toast.warning('Please sign in to shop', 'Login Required');
    setTimeout(() => window.location.href = '/login.html', 1500);
    return;
  }
  selectedProduct = allProducts.find(p => p.id === productId);
  if (!selectedProduct) return;

  const minQty = selectedProduct.min_order || 1;
  document.getElementById('add-cart-modal-body').innerHTML = `
    <div style="display:flex;gap:16px;align-items:flex-start;margin-bottom:20px">
      <div style="width:80px;height:80px;background:var(--light-green);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;overflow:hidden">
        ${selectedProduct.image ? `<img src="${selectedProduct.image}" style="width:100%;height:100%;object-fit:cover">` : '🌿'}
      </div>
      <div>
        <div style="font-weight:700;font-size:16px;font-family:'Playfair Display',serif">${selectedProduct.name}</div>
        <div style="font-size:13px;color:var(--gray);margin-top:4px">${selectedProduct.bundle_size} units per ${selectedProduct.bundle_unit}</div>
        <div style="font-size:18px;font-weight:700;color:var(--primary);margin-top:6px">${formatCurrency(selectedProduct.price)}<span style="font-size:12px;font-weight:400;color:var(--gray)"> / ${selectedProduct.bundle_unit}</span></div>
      </div>
    </div>
    <div class="form-group">
      <label>Quantity (in ${selectedProduct.bundle_unit}s)</label>
      <div style="display:flex;align-items:center;gap:12px">
        <button class="qty-btn" onclick="adjustModalQty(-1)">−</button>
        <input type="number" id="modal-qty" value="${minQty}" min="${minQty}" max="${selectedProduct.stock_quantity}"
          style="width:80px;text-align:center;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-weight:600">
        <button class="qty-btn" onclick="adjustModalQty(1)">+</button>
        <span style="font-size:13px;color:var(--gray)">(Min: ${minQty})</span>
      </div>
    </div>
    <div style="background:var(--light-green);border-radius:8px;padding:14px;margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;font-size:14px">
        <span>Subtotal:</span>
        <strong id="modal-subtotal" style="color:var(--primary)">${formatCurrency(selectedProduct.price * minQty)}</strong>
      </div>
      <div style="font-size:12px;color:var(--gray);margin-top:4px">${minQty} ${selectedProduct.bundle_unit}(s) × ${formatCurrency(selectedProduct.price)}</div>
    </div>
    <button class="btn btn-green btn-block" onclick="confirmAddToCart()">Add to Cart 🛒</button>
  `;

  document.getElementById('modal-qty').addEventListener('input', updateModalSubtotal);
  openModal('add-cart-modal');
}

function adjustModalQty(delta) {
  const input = document.getElementById('modal-qty');
  const newVal = parseInt(input.value) + delta;
  const min = parseInt(input.min);
  const max = parseInt(input.max);
  if (newVal >= min && newVal <= max) {
    input.value = newVal;
    updateModalSubtotal();
  }
}

function updateModalSubtotal() {
  if (!selectedProduct) return;
  const qty = parseInt(document.getElementById('modal-qty').value) || 1;
  document.getElementById('modal-subtotal').textContent = formatCurrency(selectedProduct.price * qty);
}

function confirmAddToCart() {
  if (!selectedProduct) return;
  const qty = parseInt(document.getElementById('modal-qty').value);
  Cart.add(selectedProduct, qty);
  closeModal('add-cart-modal');
}

async function loadCategories() {
  try {
    const data = await API.get('/products/categories');
    if (data.success) {
      const select = document.getElementById('category-filter');
      data.categories.forEach(cat => {
        select.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
    }
  } catch (e) {}
}

// WhatsApp float
(async () => {
  try {
    const s = await API.get('/payments/settings/public');
    if (s.success && s.settings.whatsapp_number) {
      document.getElementById('wa-float').href = `https://wa.me/${s.settings.whatsapp_number}`;
    }
  } catch (e) {}
})();

document.addEventListener('DOMContentLoaded', () => {
  loadCategories();
  loadProducts();
});
</script>
</body>
</html>
