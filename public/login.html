<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MC-JACOB GLOBAL FARMS LTD</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-section">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="/images/logo.png" alt="MC-Jacob Foods" class="auth-logo-img">
      <h2>Welcome Back</h2>
      <p>Sign in to your MC-Jacob dealer account</p>
    </div>

    <div id="alert-box"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div style="position:relative">
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" onclick="togglePwd('password', this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gray)">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn btn-green btn-block" id="login-btn" style="margin-top:8px">Sign In</button>
    </form>

    <div class="auth-divider"><span>New to MC-Jacob?</span></div>
    <a href="/register.html" class="btn btn-outline btn-block">Create Dealer Account</a>

    <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--gray)">
      <a href="/" style="color:var(--primary)">← Back to Home</a>
    </p>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/app.js"></script>
<script>
  // Redirect if already logged in
  if (isLoggedIn()) {
    window.location.href = isAdmin() ? '/admin/' : '/dashboard.html';
  }

  function togglePwd(id, btn) {
    const input = document.getElementById(id);
    if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
    else { input.type = 'password'; btn.textContent = '👁️'; }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    setLoading(btn, true);
    const alertBox = document.getElementById('alert-box');
    alertBox.innerHTML = '';

    try {
      const data = await API.post('/auth/login', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });

      if (data.success) {
        localStorage.setItem('mcj_token', data.token);
        localStorage.setItem('mcj_user', JSON.stringify(data.user));
        Toast.success(`Welcome back, ${data.user.full_name.split(' ')[0]}!`);
        setTimeout(() => {
          window.location.href = data.user.role === 'admin' ? '/admin/' : '/dashboard.html';
        }, 800);
      } else {
        alertBox.innerHTML = `<div class="alert alert-danger">⚠️ ${data.message}</div>`;
        setLoading(btn, false);
      }
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-danger">⚠️ Connection error. Please try again.</div>`;
      setLoading(btn, false);
    }
  }
</script>
</body>
</html>
